<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">System RAG — Corporate Policy Troubleshooting Evaluation Graph</title>
<desc id="desc">Knowledge-graph and evaluation-flow visualization for Corporate Policy troubleshooting tests in the Raggrap GraphRAG engine. Central Corporate Policy concept linked to five troubleshooting test scenarios, each mapped to Mistake and Rule nodes, overlaid on the hybrid retrieval and critic evaluation pipeline. No synthetic accuracy metrics are shown; this is a coverage and flow evaluation graph derived from src/models/schemas.py and research/research-raggraph.md.</desc>
<rect width="1280" height="860" rx="18" fill="#0f172a"/>
<rect x="14" y="14" width="1252" height="832" rx="16" fill="none" stroke="#1e293b" stroke-width="1.2"/>
<!-- header -->
<text x="36" y="56" font-family="Segoe UI, Inter, sans-serif" font-size="26" font-weight="750" fill="#f8fafc">System RAG — Corporate Policy Troubleshooting Graph</text>
<text x="36" y="80" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" fill="#94a3b8">Evaluation view: troubleshooting test coverage × correction knowledge graph × retrieval-evaluation flow  •  Source: research/research-raggraph.md + src/core + src/models/schemas.py</text>
<text x="36" y="100" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#64748b">No fabricated metrics — graph shows test structure, concept→mistake→rule topology, and PASS/FAIL evaluation paths. Add real EvaluationResult data to annotate edges with pass rates.</text>

<!-- legend -->
<g font-family="Segoe UI, Inter, sans-serif">
  <rect x="36" y="118" width="1220" height="56" rx="12" fill="#111c33" stroke="#1e3a5f"/>
  <text x="52" y="140" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.06em">LEGEND</text>
  <g font-size="12">
    <rect x="52" y="150" width="14" height="14" rx="4" fill="#bfdbfe" stroke="#60a5fa"/><text x="74" y="161" fill="#e2e8f0">Concept</text>
    <rect x="152" y="150" width="14" height="14" rx="4" fill="#fecaca" stroke="#f87171"/><text x="174" y="161" fill="#e2e8f0">Mistake</text>
    <rect x="262" y="150" width="14" height="14" rx="4" fill="#bbf7d0" stroke="#34d399"/><text x="284" y="161" fill="#e2e8f0">Rule (correction)</text>
    <rect x="418" y="150" width="14" height="14" rx="4" fill="#fde68a" stroke="#f59e0b"/><text x="440" y="161" fill="#e2e8f0">Troubleshooting test case</text>
    <rect x="608" y="150" width="14" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-dasharray="5 3"/><text x="630" y="161" fill="#e2e8f0">Retrieval edge (vector / graph)</text>
    <rect x="860" y="150" width="14" height="14" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.6"/><text x="882" y="161" fill="#e2e8f0">Evaluation edge (critic PASS/FAIL)</text>
  </g>
</g>

<!-- pipeline lane background -->
<rect x="36" y="188" width="1220" height="86" rx="12" fill="#0b1226" stroke="#1e293b"/>
<text x="52" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.08em">EVALUATION PIPELINE (how each troubleshooting test is scored)</text>
<!-- pipeline nodes -->
<g font-family="Segoe UI, Inter, sans-serif" text-anchor="middle">
  <rect x="52" y="218" width="168" height="42" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="136" y="236" font-size="11.5" font-weight="700" fill="#e0f2fe">Corporate Policy Query</text><text x="136" y="250" font-size="10" fill="#94a3b8">troubleshooting test input</text>
  <rect x="244" y="218" width="152" height="42" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="320" y="236" font-size="11.5" font-weight="700" fill="#e0f2fe">Entity Extractor</text><text x="320" y="250" font-size="10" fill="#94a3b8">SpaCy / fallback</text>
  <rect x="420" y="218" width="190" height="42" rx="10" fill="#0f2a44" stroke="#38bdf8" stroke-width="1.4"/><text x="515" y="236" font-size="11.5" font-weight="700" fill="#bae6fd">Hybrid Retrieval</text><text x="515" y="250" font-size="10" fill="#7dd3fc">Vector (Chroma) + Graph (Neo4j)</text>
  <rect x="634" y="218" width="162" height="42" rx="10" fill="#1e293b" stroke="#a78bfa"/><text x="715" y="236" font-size="11.5" font-weight="700" fill="#ede9fe">Main LLM</text><text x="715" y="250" font-size="10" fill="#c4b5fd">with Rule warnings</text>
  <rect x="820" y="218" width="150" height="42" rx="10" fill="#1e293b" stroke="#a78bfa"/><text x="895" y="236" font-size="11.5" font-weight="700" fill="#ede9fe">Critic LLM</text><text x="895" y="250" font-size="10" fill="#c4b5fd">EvaluationResult</text>
  <rect x="994" y="214" width="118" height="22" rx="8" fill="#052e1a" stroke="#22c55e"/><text x="1053" y="228" font-size="11" font-weight="800" fill="#bbf7d0">PASS → Cache</text>
  <rect x="994" y="240" width="118" height="22" rx="8" fill="#3f0a0a" stroke="#f87171"/><text x="1053" y="254" font-size="11" font-weight="800" fill="#fecaca">FAIL → Correct</text>
  <!-- arrows -->
  <g stroke="#334155" stroke-width="1.4" marker-end="url(#arrowMuted)" fill="none">
    <line x1="220" y1="239" x2="244" y2="239"/><line x1="396" y1="239" x2="420" y2="239"/><line x1="610" y1="239" x2="634" y2="239"/><line x1="796" y1="239" x2="820" y2="239"/><line x1="970" y1="232" x2="994" y2="225"/><line x1="970" y1="246" x2="994" y2="251"/>
  </g>
</g>

<!-- main graph area -->
<rect x="36" y="290" width="1220" height="516" rx="14" fill="#0b1226" stroke="#1e293b"/>
<text x="52" y="314" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.08em">KNOWLEDGE GRAPH — CORPORATE POLICY TROUBLESHOOTING TEST MAP (Concept → Test Case → Mistake → Rule)</text>

<defs>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/></filter>
</defs>

<!-- edges (behind nodes) -->
<g fill="none" stroke-width="1.5">
  <!-- central to test cases -->
  <line x1="640" y1="392" x2="210" y2="452" stroke="#f59e0b" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <line x1="640" y1="392" x2="430" y2="452" stroke="#f59e0b" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <line x1="640" y1="410" x2="640" y2="452" stroke="#f59e0b" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <line x1="640" y1="410" x2="850" y2="452" stroke="#f59e0b" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <line x1="640" y1="392" x2="1070" y2="452" stroke="#f59e0b" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <!-- test -> mistake -->
  <line x1="210" y1="510" x2="210" y2="582" stroke="#f87171" marker-end="url(#arrowRed)"/>
  <line x1="430" y1="510" x2="430" y2="582" stroke="#f87171" marker-end="url(#arrowRed)"/>
  <line x1="640" y1="510" x2="640" y2="582" stroke="#f87171" marker-end="url(#arrowRed)"/>
  <line x1="850" y1="510" x2="850" y2="582" stroke="#f87171" marker-end="url(#arrowRed)"/>
  <line x1="1070" y1="510" x2="1070" y2="582" stroke="#f87171" marker-end="url(#arrowRed)"/>
  <!-- mistake -> rule -->
  <line x1="210" y1="640" x2="210" y2="698" stroke="#22c55e" marker-end="url(#arrowGreen)"/>
  <line x1="430" y1="640" x2="430" y2="698" stroke="#22c55e" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="640" x2="640" y2="698" stroke="#22c55e" marker-end="url(#arrowGreen)"/>
  <line x1="850" y1="640" x2="850" y2="698" stroke="#22c55e" marker-end="url(#arrowGreen)"/>
  <line x1="1070" y1="640" x2="1070" y2="698" stroke="#22c55e" marker-end="url(#arrowGreen)"/>
  <!-- rule -> central (APPLIES_TO) curved -->
  <path d="M 300 740 Q 640 790 640 432" stroke="#22c55e" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.9" marker-end="url(#arrowGreen)"/>
  <path d="M 980 740 Q 640 800 640 432" stroke="#22c55e" stroke-width="1.1" stroke-dasharray="4 5" opacity="0.9" marker-end="url(#arrowGreen)"/>
  <!-- retrieval edges from tests to hybrid -->
  <path d="M 210 478 Q 360 360 515 260" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.55" marker-end="url(#arrowBlue)"/>
  <path d="M 1070 478 Q 860 340 560 260" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.55" marker-end="url(#arrowBlue)"/>
</g>
<!-- edge labels -->
<g font-family="Segoe UI, Inter, sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">
  <text x="380" y="410">HAS_TEST_CASE</text>
  <text x="880" y="410">HAS_TEST_CASE</text>
  <text x="210" y="562" fill="#fca5a5">HAS_MISCONCEPTION</text>
  <text x="640" y="562" fill="#fca5a5">HAS_MISCONCEPTION</text>
  <text x="1070" y="562" fill="#fca5a5">HAS_MISCONCEPTION</text>
  <text x="210" y="676" fill="#86efac">CORRECTED_BY</text>
  <text x="640" y="676" fill="#86efac">CORRECTED_BY</text>
  <text x="1070" y="676" fill="#86efac">CORRECTED_BY</text>
  <text x="760" y="778" fill="#86efac">APPLIES_TO → Corporate Policy</text>
</g>

<!-- nodes -->
<g font-family="Segoe UI, Inter, sans-serif" text-anchor="middle" filter="url(#shadow)">
  <!-- central concept -->
  <rect x="520" y="352" width="240" height="64" rx="16" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="640" y="376" font-size="13" font-weight="800" fill="#0f172a">Corporate Policy</text>
  <text x="640" y="394" font-size="10.5" fill="#1e40af">Concept  •  casefold-normalized</text>
  <text x="640" y="408" font-size="9" fill="#334155">5 troubleshooting test areas</text>

  <!-- test cases -->
  <g>
    <rect x="110" y="452" width="200" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="210" y="472" font-size="11.5" font-weight="800" fill="#78350f">T1 · Expense Reimbursement</text>
    <text x="210" y="486" font-size="9.5" fill="#92400e">"Can I reimburse client dinner?"</text>
    <text x="210" y="500" font-size="8.5" fill="#a16207">Severity: HIGH  •  Query Pattern</text>

    <rect x="330" y="452" width="200" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="430" y="472" font-size="11.5" font-weight="800" fill="#78350f">T2 · Leave &amp; Attendance</text>
    <text x="430" y="486" font-size="9.5" fill="#92400e">"Unused PTO payout on exit?"</text>
    <text x="430" y="500" font-size="8.5" fill="#a16207">Severity: MEDIUM  •  Query Pattern</text>

    <rect x="540" y="452" width="200" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="640" y="472" font-size="11.5" font-weight="800" fill="#78350f">T3 · Data Privacy &amp; InfoSec</text>
    <text x="640" y="486" font-size="9.5" fill="#92400e">"Share customer data via email?"</text>
    <text x="640" y="500" font-size="8.5" fill="#a16207">Severity: CRITICAL  •  Query Pattern</text>

    <rect x="750" y="452" width="200" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="850" y="472" font-size="11.5" font-weight="800" fill="#78350f">T4 · Code of Conduct</text>
    <text x="850" y="486" font-size="9.5" fill="#92400e">"Accept vendor gift $200?"</text>
    <text x="850" y="500" font-size="8.5" fill="#a16207">Severity: HIGH  •  Query Pattern</text>

    <rect x="970" y="452" width="200" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="1070" y="472" font-size="11.5" font-weight="800" fill="#78350f">T5 · Remote Work &amp; Devices</text>
    <text x="1070" y="486" font-size="9.5" fill="#92400e">"Use personal laptop for prod?"</text>
    <text x="1070" y="500" font-size="8.5" fill="#a16207">Severity: MEDIUM  •  Query Pattern</text>
  </g>

  <!-- mistakes -->
  <g>
    <rect x="110" y="582" width="200" height="58" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="210" y="600" font-size="10.5" font-weight="800" fill="#7f1d1d">Mistake M1</text>
    <text x="210" y="614" font-size="9" fill="#991b1b">Missing receipt threshold;</text>
    <text x="210" y="626" font-size="9" fill="#991b1b">wrong approval chain</text>

    <rect x="330" y="582" width="200" height="58" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="430" y="600" font-size="10.5" font-weight="800" fill="#7f1d1d">Mistake M2</text>
    <text x="430" y="614" font-size="9" fill="#991b1b">Confuses accrual vs payout;</text>
    <text x="430" y="626" font-size="9" fill="#991b1b">ignores state law variation</text>

    <rect x="540" y="582" width="200" height="58" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="640" y="600" font-size="10.5" font-weight="800" fill="#7f1d1d">Mistake M3</text>
    <text x="640" y="614" font-size="9" fill="#991b1b">Treats email as secure channel;</text>
    <text x="640" y="626" font-size="9" fill="#991b1b">leaks PII without DLP check</text>

    <rect x="750" y="582" width="200" height="58" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="850" y="600" font-size="10.5" font-weight="800" fill="#7f1d1d">Mistake M4</text>
    <text x="850" y="614" font-size="9" fill="#991b1b">Misstates gift threshold ($50);</text>
    <text x="850" y="626" font-size="9" fill="#991b1b">omits disclosure requirement</text>

    <rect x="970" y="582" width="200" height="58" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="1070" y="600" font-size="10.5" font-weight="800" fill="#7f1d1d">Mistake M5</text>
    <text x="1070" y="614" font-size="9" fill="#991b1b">Allows unmanaged device</text>
    <text x="1070" y="626" font-size="9" fill="#991b1b">without MDM / VPN guardrail</text>
  </g>

  <!-- rules -->
  <g>
    <rect x="110" y="698" width="200" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="210" y="716" font-size="10.5" font-weight="800" fill="#14532d">Rule R1</text>
    <text x="210" y="730" font-size="8.5" fill="#166534">Receipt required &gt; $25; manager</text>
    <text x="210" y="742" font-size="8.5" fill="#166534">+ finance approval above $500</text>

    <rect x="330" y="698" width="200" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="430" y="716" font-size="10.5" font-weight="800" fill="#14532d">Rule R2</text>
    <text x="430" y="730" font-size="8.5" fill="#166534">PTO payout per local law;</text>
    <text x="430" y="742" font-size="8.5" fill="#166534">check HR matrix before answering</text>

    <rect x="540" y="698" width="200" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="640" y="716" font-size="10.5" font-weight="800" fill="#14532d">Rule R3</text>
    <text x="640" y="730" font-size="8.5" fill="#166534">No PII via email; use secure</text>
    <text x="640" y="742" font-size="8.5" fill="#166534">share + DLP approval workflow</text>

    <rect x="750" y="698" width="200" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="850" y="716" font-size="10.5" font-weight="800" fill="#14532d">Rule R4</text>
    <text x="850" y="730" font-size="8.5" fill="#166534">Gift limit $50; disclose &amp; decline</text>
    <text x="850" y="742" font-size="8.5" fill="#166534">above threshold, log in register</text>

    <rect x="970" y="698" width="200" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
    <text x="1070" y="716" font-size="10.5" font-weight="800" fill="#14532d">Rule R5</text>
    <text x="1070" y="730" font-size="8.5" fill="#166534">Prod access only on MDM-enrolled</text>
    <text x="1070" y="742" font-size="8.5" fill="#166534">device via VPN + MFA</text>
  </g>
</g>

<!-- footer -->
<rect x="36" y="818" width="1220" height="28" rx="8" fill="#111c33" stroke="#1e3a5f"/>
<g font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#94a3b8">
  <text x="52" y="836">How to evaluate: run each T1–T5 query through GraphRAGEngine.query(); critic returns EvaluationResult.is_correct + reason; aggregate PASS/FAIL per rule to measure correction recall.</text>
  <text x="1120" y="836" font-size="9" fill="#64748b">Raggrap • Img/</text>
</g>
</svg>
