[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkay-tdai"
version = "0.1.0"
description = "Multi-agent AI system for real-time Gold (XAUUSD) and Bitcoin (BTCUSD) market analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pkay TDAI Contributors" }]
keywords = ["trading", "multi-agent", "technical-analysis", "quant", "biquote"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "tenacity>=8.3",
    "structlog>=24.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "redis>=5.0",
    "celery>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Jinja2Templates is used to render the login/consent pages served by the
    # gateway; Starlette raises at import time if the package is missing.
    "jinja2>=3.1",
    # Required by FastAPI for `Form(...)` fields on the auth endpoints.
    "python-multipart>=0.0.9",
    # Telegram signal bot: the client library and the scheduler that drives the
    # per-timeframe scan jobs. Both are imported by `telegram_bot.app`, which is
    # the module's documented entry point.
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "torch>=2.3",
]
llm = [
    "openai>=1.35",
    "anthropic>=0.34",
]
vector = [
    "qdrant-client>=1.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-redis",
]

[project.urls]
Homepage = "https://github.com/your-org/pkay-tdai"
Repository = "https://github.com/your-org/pkay-tdai"

[tool.setuptools]
packages = [
    "agents",
    "agents.technical_analyst",
    "agents.technical_analyst.models",
    "agents.news_monitor",
    "agents.news_monitor.scrapers",
    "agents.risk_manager",
    "agents.decision_maker",
    "signals",
    "telegram_bot",
    "shared",
    "shared.schemas",
    "shared.database",
    "shared.vector_store",
    "shared.utils",
    "data_pipeline",
    "execution",
    "orchestrator",
    "Raggrap",
    "Raggrap.config",
    "Raggrap.src",
    "Raggrap.src.core",
    "Raggrap.src.models",
]
# The signal bot's tests ship as a package so their module names cannot collide
# with the identically named files under `tests/` (e.g. test_indicators.py).

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "signals/tests", "telegram_bot/tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: tests that require external services (Redis, Postgres, network)",
]

[tool.coverage.run]
branch = true
source = ["agents", "shared", "signals", "telegram_bot", "data_pipeline", "execution", "orchestrator"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".venv", "venv", "frontend", "Research", "build", "dist",
    "Raggrap/research", "Raggrap/Img",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The Raggrap engine lives in its own documented project folder ("Raggrap/").
"Raggrap/**" = ["N999"]
"tests/**" = ["S101"]
# Community API response models intentionally mirror the camelCase frontend types.
"orchestrator/community.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "shared", "signals", "telegram_bot", "data_pipeline", "execution", "orchestrator"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["agents", "shared", "signals", "telegram_bot", "data_pipeline", "execution", "orchestrator", "Raggrap"]
exclude = ["venv", "\\.venv", "build", "dist", "Raggrap/research", "Raggrap/Img"]

[[tool.mypy.overrides]]
module = ["celery.*", "qdrant_client.*", "openai.*", "anthropic.*", "xgboost.*", "torch.*", "sklearn.*"]
ignore_missing_imports = true

# Optional Raggrap dependencies: the engine falls back to in-memory/deterministic
# providers at runtime, so these SDKs may be absent under strict CI.
[[tool.mypy.overrides]]
module = ["spacy", "chromadb", "neo4j", "redis", "Raggrap.*"]
ignore_missing_imports = true

# Telegram and APScheduler both ship partial stubs; the bot is typed against their
# documented API rather than against what their markers currently declare.
[[tool.mypy.overrides]]
module = ["telegram.*", "apscheduler.*"]
ignore_missing_imports = true
